<svg width="1300" viewBox="0 0 1300 460" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Entity relationship diagram: guide curve rootedness via sibling representation (§10.6.1.4)</title>
  <desc>IfcPavement's IfcProductDefinitionShape carries two sibling IfcShapeRepresentation entries in its Representations list: Body (SectionedSurface), containing the IfcSectionedSurface, and Axis (GeometricCurveSet), containing three tagged IfcOffsetCurveByDistances guide curves (Tag = 'A', 'B', 'C'). No placeholder IfcAlignment or other rooted host entity exists for the guide curves; they inherit rootedness through the same IfcProductDefinitionShape as the surface.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: sans-serif; fill: #1a1a1a; }
      .th  { font-size: 14px; font-weight: 500; }
      .ts  { font-size: 12px; font-weight: 400; fill: #555; }
      .lbl { font-size: 11px; font-weight: 400; fill: #777; }

      /* Rooted product / root entity — purple */
      .c-purple rect  { fill: #EEEDFE; stroke: #534AB7; }
      .c-purple .th   { fill: #3C3489; }
      .c-purple .ts   { fill: #534AB7; }

      /* Representation infrastructure — blue */
      .c-blue rect    { fill: #E6F1FB; stroke: #185FA5; }
      .c-blue .th     { fill: #0C447C; }
      .c-blue .ts     { fill: #185FA5; }

      /* Geometry / tag content — teal */
      .c-teal rect    { fill: #E1F5EE; stroke: #0F6E56; }
      .c-teal .th     { fill: #085041; }
      .c-teal .ts     { fill: #0F6E56; }

      /* Relationship — gray */
      .c-gray rect    { fill: #F1EFE8; stroke: #5F5E5A; }
      .c-gray .th     { fill: #2C2C2A; }
      .c-gray .ts     { fill: #5F5E5A; }
    </style>
  </defs>

  <!-- ── Legend ── -->
  <rect x="40" y="20" width="280" height="108" rx="6" fill="none" stroke="#ccc" stroke-width="0.5"/>
  <text class="ts" x="180" y="38" text-anchor="middle" fill="#555">Legend</text>
  <rect x="52" y="48" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="lbl" x="70" y="59">Rooted product</text>
  <rect x="52" y="68" width="12" height="12" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="lbl" x="70" y="79">Representation infrastructure</text>
  <rect x="52" y="88" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="lbl" x="70" y="99">Geometry / tag content</text>
  <rect x="52" y="108" width="12" height="12" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="lbl" x="70" y="119">Relationship</text>

  <!-- ── Dashed enclosure: same IfcProductDefinitionShape.Representations list ── -->
  <rect x="630" y="40" width="610" height="390" rx="10" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="6 4"/>
  <text class="lbl" x="935" y="26" text-anchor="middle">Representations = [Body, Axis] — same IfcProductDefinitionShape.Representations list (ordered, sibling entries)</text>

  <!-- ── IfcPavement ── -->
  <g class="c-purple">
    <rect x="40" y="150" width="200" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="140" y="178" text-anchor="middle" dominant-baseline="central">IfcPavement</text>
  </g>

  <!-- ── IfcProductDefinitionShape ── -->
  <g class="c-blue">
    <rect x="330" y="154" width="220" height="48" rx="8" stroke-width="0.5"/>
    <text class="th" x="440" y="178" text-anchor="middle" dominant-baseline="central">IfcProductDefinitionShape</text>
  </g>

  <!-- arrow: IfcPavement → IfcProductDefinitionShape -->
  <line x1="240" y1="178" x2="328" y2="178" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)" fill="none"/>
  <text class="lbl" x="284" y="168" text-anchor="middle">Representation</text>

  <!-- ── IfcShapeRepresentation "Body" ── -->
  <g class="c-blue">
    <rect x="650" y="60" width="240" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="770" y="82" text-anchor="middle" dominant-baseline="central">IfcShapeRepresentation</text>
    <text class="ts" x="770" y="104" text-anchor="middle" dominant-baseline="central">"Body" / SectionedSurface</text>
  </g>

  <!-- ── IfcShapeRepresentation "Axis" ── -->
  <g class="c-blue">
    <rect x="650" y="280" width="240" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="770" y="302" text-anchor="middle" dominant-baseline="central">IfcShapeRepresentation</text>
    <text class="ts" x="770" y="324" text-anchor="middle" dominant-baseline="central">"Axis" / GeometricCurveSet</text>
  </g>

  <!-- arrow: IfcProductDefinitionShape → "Body" representation -->
  <path d="M550 168 L610 168 L610 88 L648 88" fill="none" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>
  <text class="lbl" x="602" y="132" text-anchor="end">Representations[0]</text>

  <!-- arrow: IfcProductDefinitionShape → "Axis" representation -->
  <path d="M550 188 L610 188 L610 308 L648 308" fill="none" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>
  <text class="lbl" x="602" y="252" text-anchor="end">Representations[1]</text>

  <!-- ── IfcSectionedSurface ── -->
  <g class="c-teal">
    <rect x="980" y="64" width="240" height="48" rx="8" stroke-width="0.5"/>
    <text class="th" x="1100" y="88" text-anchor="middle" dominant-baseline="central">IfcSectionedSurface</text>
  </g>

  <!-- arrow: "Body" representation → IfcSectionedSurface -->
  <line x1="890" y1="88" x2="978" y2="88" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)" fill="none"/>
  <text class="lbl" x="934" y="78" text-anchor="middle">Items</text>

  <!-- ── IfcOffsetCurveByDistances × 3 (A, B, C) ── -->
  <g class="c-teal">
    <rect x="980" y="242" width="240" height="40" rx="8" stroke-width="0.5"/>
    <text class="th" x="1100" y="257" text-anchor="middle" dominant-baseline="central">IfcOffsetCurveByDistances</text>
    <text class="ts" x="1100" y="273" text-anchor="middle" dominant-baseline="central">Tag = "A"</text>
  </g>
  <g class="c-teal">
    <rect x="980" y="288" width="240" height="40" rx="8" stroke-width="0.5"/>
    <text class="th" x="1100" y="303" text-anchor="middle" dominant-baseline="central">IfcOffsetCurveByDistances</text>
    <text class="ts" x="1100" y="319" text-anchor="middle" dominant-baseline="central">Tag = "B"</text>
  </g>
  <g class="c-teal">
    <rect x="980" y="334" width="240" height="40" rx="8" stroke-width="0.5"/>
    <text class="th" x="1100" y="349" text-anchor="middle" dominant-baseline="central">IfcOffsetCurveByDistances</text>
    <text class="ts" x="1100" y="365" text-anchor="middle" dominant-baseline="central">Tag = "C"</text>
  </g>

  <!-- spine + branches: "Axis" representation → three offset curves -->
  <path d="M890 308 L940 308" fill="none" stroke="#185FA5" stroke-width="1"/>
  <path d="M940 262 L940 354" fill="none" stroke="#185FA5" stroke-width="1"/>
  <path d="M940 262 L978 262" fill="none" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M940 308 L978 308" fill="none" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M940 354 L978 354" fill="none" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>
  <text class="lbl" x="932" y="252" text-anchor="end">Items (ordered list of 3)</text>

  <!-- ── Footer note ── -->
  <text class="lbl" x="650" y="422" text-anchor="middle" fill="#aaa">No placeholder host entity: guide curves inherit rootedness through IfcPavement's own IfcProductDefinitionShape.</text>
</svg>
