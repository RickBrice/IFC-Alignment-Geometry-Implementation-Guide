<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430" font-family="'Georgia', serif">

  <defs>
    <marker id="arrowOrange" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#e67e22"/>
    </marker>
    <marker id="arrowOrangeL" markerWidth="6" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L6,3 z" fill="#e67e22"/>
    </marker>
    <marker id="arrowGray" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#888"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="430" fill="#f9f7f4"/>

  <!-- Title -->
  <text x="410" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a2e" letter-spacing="0.5">Reverse Stationing — Geometric Distance vs. Station Label Axes</text>
  <text x="410" y="48" text-anchor="middle" font-size="11" fill="#555" font-style="italic">Station labels decrease as DistanceAlong increases; one gap equation at R₂</text>

  <!-- ══════════════════════════════════════════════
       TOP PANEL — Geometric distance axis
       ══════════════════════════════════════════════ -->

  <rect x="40" y="65" width="740" height="120" rx="6" fill="#eef2f8" stroke="#b0bcd4" stroke-width="1"/>
  <text x="55" y="84" font-size="11" font-weight="bold" fill="#1a1a2e" letter-spacing="0.3">Geometric Distance Axis  (uniform, always increasing)</text>

  <!-- Axis line -->
  <line x1="80" y1="135" x2="740" y2="135" stroke="#1a1a2e" stroke-width="2.5"/>
  <polygon points="740,135 730,130 730,140" fill="#1a1a2e"/>
  <text x="750" y="139" font-size="10" fill="#1a1a2e">d</text>

  <!-- R1 d=0 -->
  <line x1="120" y1="128" x2="120" y2="142" stroke="#1a1a2e" stroke-width="1.5"/>
  <text x="120" y="123" text-anchor="middle" font-size="10" fill="#1a1a2e">R₁</text>
  <text x="120" y="157" text-anchor="middle" font-size="9" fill="#444">d = 0</text>

  <!-- R2 d=400 -->
  <line x1="400" y1="128" x2="400" y2="142" stroke="#c0392b" stroke-width="2"/>
  <text x="400" y="123" text-anchor="middle" font-size="10" fill="#c0392b" font-weight="bold">R₂</text>
  <text x="400" y="157" text-anchor="middle" font-size="9" fill="#c0392b">d = 400</text>

  <!-- R3 d=800 -->
  <line x1="680" y1="128" x2="680" y2="142" stroke="#1a1a2e" stroke-width="1.5"/>
  <text x="680" y="123" text-anchor="middle" font-size="10" fill="#1a1a2e">R₃</text>
  <text x="680" y="157" text-anchor="middle" font-size="9" fill="#444">d = 800</text>

  <!-- Uniform spacing annotation -->
  <line x1="120" y1="170" x2="680" y2="170" stroke="#aaa" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="400" y="181" text-anchor="middle" font-size="9" fill="#888" font-style="italic">uniform geometric spacing</text>

  <!-- ══════════════════════════════════════════════
       VERTICAL DASHED CONNECTORS
       ══════════════════════════════════════════════ -->

  <line x1="120" y1="185" x2="120" y2="272" stroke="#666" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="400" y1="185" x2="400" y2="272" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="5,3"/>
  <line x1="680" y1="185" x2="680" y2="272" stroke="#666" stroke-width="1" stroke-dasharray="5,3"/>

  <!-- ══════════════════════════════════════════════
       BOTTOM PANEL — Station label axis
       ══════════════════════════════════════════════ -->

  <rect x="40" y="200" width="740" height="200" rx="6" fill="#fdf4f4" stroke="#d4b0b0" stroke-width="1"/>
  <text x="55" y="219" font-size="11" font-weight="bold" fill="#1a1a2e" letter-spacing="0.3">Station Label Axis  (labels decrease left → right; gap equation at R₂)</text>

  <!-- Station axis line -->
  <line x1="80" y1="310" x2="740" y2="310" stroke="#1a1a2e" stroke-width="2.5"/>
  <polygon points="740,310 730,305 730,315" fill="#1a1a2e"/>
  <text x="750" y="314" font-size="10" fill="#1a1a2e">s</text>

  <!-- direction of increasing station: points left, opposite the geometric axis -->
  <line x1="590" y1="215" x2="530" y2="215" stroke="#888" stroke-width="1.2" marker-end="url(#arrowGray)"/>
  <text x="598" y="219" font-size="9" fill="#888" font-style="italic">direction of increasing station</text>

  <!-- R1: sta 20+00 -->
  <line x1="120" y1="303" x2="120" y2="317" stroke="#1a1a2e" stroke-width="1.5"/>
  <text x="120" y="298" text-anchor="middle" font-size="10" fill="#1a1a2e">R₁</text>
  <text x="120" y="332" text-anchor="middle" font-size="9" fill="#444">20+00</text>
  <text x="120" y="345" text-anchor="middle" font-size="8" fill="#888">S = 2000.00</text>

  <!-- R2: GAP point — in=16+00, out=15+50 -->
  <line x1="400" y1="303" x2="400" y2="317" stroke="#c0392b" stroke-width="2.5"/>
  <text x="400" y="298" text-anchor="middle" font-size="10" fill="#c0392b" font-weight="bold">R₂</text>
  <text x="372" y="332" text-anchor="middle" font-size="8.5" fill="#c0392b">in: 16+00</text>
  <text x="430" y="332" text-anchor="middle" font-size="8.5" fill="#c0392b">out: 15+50</text>
  <!-- Gap annotation: two-headed arrow above tick -->
  <line x1="372" y1="268" x2="430" y2="268" stroke="#e67e22" stroke-width="1.5"
        marker-start="url(#arrowOrangeL)" marker-end="url(#arrowOrange)"/>
  <text x="401" y="262" text-anchor="middle" font-size="8.5" fill="#e67e22" font-weight="bold">GAP  (50 skipped)</text>
  <line x1="400" y1="303" x2="400" y2="273" stroke="#e67e22" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- R3: sta 11+50 -->
  <line x1="680" y1="303" x2="680" y2="317" stroke="#1a1a2e" stroke-width="1.5"/>
  <text x="680" y="298" text-anchor="middle" font-size="10" fill="#1a1a2e">R₃</text>
  <text x="680" y="332" text-anchor="middle" font-size="9" fill="#444">11+50</text>
  <text x="680" y="345" text-anchor="middle" font-size="8" fill="#888">S = 1150.00</text>

  <!-- Legend -->
  <line x1="58" y1="376" x2="78" y2="376" stroke="#e67e22" stroke-width="1.5"
        marker-start="url(#arrowOrangeL)" marker-end="url(#arrowOrange)"/>
  <text x="85" y="380" font-size="9" fill="#444">Gap under decreasing stationing: out &lt; in — labels between 15+50 and 16+00 are skipped</text>
  <text x="58" y="393" font-size="9" fill="#888" font-style="italic">The station label axis runs opposite the geometric distance axis: HasIncreasingStation = FALSE on R₁.</text>

</svg>
