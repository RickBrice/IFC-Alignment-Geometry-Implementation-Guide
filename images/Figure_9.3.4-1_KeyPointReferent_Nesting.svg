<svg width="760" viewBox="0 0 760 640" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Key-point referent nesting: IfcAlignmentHorizontal and IfcAlignmentVertical each nest their own POSITION referents via a separate IfcRelNests</title>
  <desc>IfcAlignmentHorizontal is RelatingObject of an IfcRelNests nesting its own key-point IfcReferent instances (PredefinedType POSITION, e.g. P.O.B., P.C., P.T., P.O.E.), each carrying Pset_Stationing. IfcAlignmentVertical has an independent, parallel IfcRelNests nesting its own key-point referents (e.g. V.P.O.B., P.V.C., P.V.T., V.P.O.E.). A muted note indicates that nesting to IfcAlignment instead, or combining both disciplines into one nest, is schema-legal but not the recommended pattern.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: sans-serif; fill: #1a1a1a; }
      .th  { font-size: 14px; font-weight: 500; }
      .ts  { font-size: 12px; font-weight: 400; }

      .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
      .c-purple .th  { fill: #3C3489; }
      .c-purple .ts  { fill: #534AB7; }

      .c-gray rect   { fill: #F1EFE8; stroke: #5F5E5A; }
      .c-gray .th    { fill: #2C2C2A; }
      .c-gray .ts    { fill: #5F5E5A; }

      .c-blue rect   { fill: #E6F1FB; stroke: #185FA5; }
      .c-blue .th    { fill: #0C447C; }
      .c-blue .ts    { fill: #185FA5; }

      .c-teal rect   { fill: #E1F5EE; stroke: #0F6E56; }
      .c-teal .th    { fill: #085041; }
      .c-teal .ts    { fill: #0F6E56; }

      .muted { fill: #888; }
      .hint  { fill: #aaa; }
    </style>
  </defs>

  <!-- ── IfcAlignmentHorizontal (top left) ── -->
  <g class="c-blue">
    <rect x="40" y="30" width="230" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="155" y="52" text-anchor="middle" dominant-baseline="central">IfcAlignmentHorizontal</text>
  </g>

  <!-- ── IfcAlignmentVertical (top right) ── -->
  <g class="c-blue">
    <rect x="490" y="30" width="230" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="605" y="52" text-anchor="middle" dominant-baseline="central">IfcAlignmentVertical</text>
  </g>

  <!-- ── IfcRelNests (left, horizontal key points) ── -->
  <g class="c-gray">
    <rect x="55" y="140" width="200" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="155" y="156" text-anchor="middle" dominant-baseline="central">IfcRelNests</text>
    <text class="ts" x="155" y="174" text-anchor="middle" dominant-baseline="central">horizontal key points</text>
  </g>

  <!-- ── IfcRelNests (right, vertical key points) ── -->
  <g class="c-gray">
    <rect x="505" y="140" width="200" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="605" y="156" text-anchor="middle" dominant-baseline="central">IfcRelNests</text>
    <text class="ts" x="605" y="174" text-anchor="middle" dominant-baseline="central">vertical key points</text>
  </g>

  <!-- arrow: IfcAlignmentHorizontal → IfcRelNests (left) -->
  <line x1="155" y1="74" x2="155" y2="138" stroke="#888" stroke-width="1" marker-end="url(#arrow)" fill="none"/>
  <text class="ts muted" x="163" y="106">RelatingObject</text>

  <!-- arrow: IfcAlignmentVertical → IfcRelNests (right) -->
  <line x1="605" y1="74" x2="605" y2="138" stroke="#888" stroke-width="1" marker-end="url(#arrow)" fill="none"/>
  <text class="ts muted" x="613" y="106">RelatingObject</text>

  <!-- ── IfcReferent (left, horizontal) ── -->
  <g class="c-teal">
    <rect x="45" y="256" width="220" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="155" y="276" text-anchor="middle" dominant-baseline="central">IfcReferent</text>
    <text class="ts" x="155" y="298" text-anchor="middle" dominant-baseline="central">PredefinedType = POSITION</text>
  </g>
  <text class="ts muted" x="55" y="242">RelatedObjects (ordered, e.g. 8 referents)</text>
  <text class="ts hint" x="45" y="330">P.O.B., P.C., P.T., P.C., P.T., P.C., P.T., P.O.E.</text>

  <!-- arrow: IfcRelNests (left) → IfcReferent (left) -->
  <line x1="155" y1="184" x2="155" y2="254" stroke="#888" stroke-width="1" marker-end="url(#arrow)" fill="none"/>

  <!-- ── IfcReferent (right, vertical) ── -->
  <g class="c-teal">
    <rect x="495" y="256" width="220" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="605" y="276" text-anchor="middle" dominant-baseline="central">IfcReferent</text>
    <text class="ts" x="605" y="298" text-anchor="middle" dominant-baseline="central">PredefinedType = POSITION</text>
  </g>
  <text class="ts muted" x="505" y="242">RelatedObjects (ordered, e.g. 10 referents)</text>
  <text class="ts hint" x="495" y="330">V.P.O.B., P.V.C., P.V.T., ... , V.P.O.E.</text>

  <!-- arrow: IfcRelNests (right) → IfcReferent (right) -->
  <line x1="605" y1="184" x2="605" y2="254" stroke="#888" stroke-width="1" marker-end="url(#arrow)" fill="none"/>

  <!-- ── Pset_Stationing (left) ── -->
  <g class="c-teal">
    <rect x="45" y="400" width="220" height="56" rx="8" stroke-width="0.5" stroke-dasharray="4 3"/>
    <text class="th" x="155" y="420" text-anchor="middle" dominant-baseline="central">Pset_Stationing</text>
    <text class="ts" x="155" y="442" text-anchor="middle" dominant-baseline="central">Station</text>
  </g>
  <line x1="155" y1="312" x2="155" y2="398" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)" fill="none"/>
  <text class="ts muted" x="163" y="360">HasProperties</text>

  <!-- ── Pset_Stationing (right) ── -->
  <g class="c-teal">
    <rect x="495" y="400" width="220" height="56" rx="8" stroke-width="0.5" stroke-dasharray="4 3"/>
    <text class="th" x="605" y="420" text-anchor="middle" dominant-baseline="central">Pset_Stationing</text>
    <text class="ts" x="605" y="442" text-anchor="middle" dominant-baseline="central">Station</text>
  </g>
  <line x1="605" y1="312" x2="605" y2="398" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)" fill="none"/>
  <text class="ts muted" x="613" y="360">HasProperties</text>

  <!-- ── Alternative-pattern note (muted, not fully diagrammed) ── -->
  <g class="c-purple">
    <rect x="270" y="500" width="220" height="44" rx="8" stroke-width="0.5" stroke-dasharray="4 3"/>
    <text class="th" x="380" y="516" text-anchor="middle" dominant-baseline="central">IfcAlignment</text>
    <text class="ts" x="380" y="534" text-anchor="middle" dominant-baseline="central">(alternative RelatingObject)</text>
  </g>
  <path d="M270 515 L160 190" fill="none" stroke="#aaa" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M490 515 L610 190" fill="none" stroke="#aaa" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- ── Footer note ── -->
  <text class="ts hint" x="380" y="580" text-anchor="middle">Recommended: nest each discipline's key-point referents to its own layout, not to IfcAlignment.</text>
  <text class="ts hint" x="380" y="600" text-anchor="middle">Nesting to IfcAlignment instead (dashed) is schema-legal; combining both disciplines into one nest is also legal but discouraged (§9.3.4).</text>
</svg>
